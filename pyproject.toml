[project]
name = "refrain"
version = "0.13.0"
description = "Windows desktop app for browsing a music library, editing tags, tidying albums and finding lyrics."
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    # Essentials only: the app needs QtCore/QtGui/QtWidgets, and the Addons wheel (WebEngine etc.) bloats the build.
    "PySide6-Essentials==6.12.0",
    "mutagen",
    "watchdog",
    "natsort",
    "send2trash",
]

[project.gui-scripts]
refrain = "refrain.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "pyinstaller",
    "tinytag==2.0.0",
    "basedpyright>=1.40.2",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refrain"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["tests/reference", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/core"]  # shared helpers such as lrclib_fake, for tests in any folder
norecursedirs = ["reference", "fixtures", ".*", "build", "dist"]
qt_api = "pyside6"
# SPEC §18: the performance measurements run only when asked for (`-m perf`; a later -m replaces this one), and
# workers follow the size of the run (tests/conftest.py, pytest_xdist_auto_num_workers; -n 0 runs in one process).
addopts = ["-m", "not perf", "-n", "auto"]
markers = ["perf: a performance measurement on a large synthetic tree (run with -m perf; SPEC §18)"]

[tool.basedpyright]
# M11 task 1 (SPEC §18): basic mode, the app's code only. Untyped third-party packages count as Any.
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
